name: Pull Request Check
on: [pull_request]

jobs:
  lint-ruff:
    name: "Lint check (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
  lint-prettier:
    name: "Lint check (prettier)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npx prettier --check --plugin=prettier-plugin-solidity contracts/**/*.sol interfaces/**/*.sol sandbox/**/*.sol
  unit-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          enable-cache: true
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10  # v1.7.0
        with:
          version: stable
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Import Brownie network settings
        run: uv run brownie networks import data/networks.yml true
      - name: Compile contracts
        run: uv run brownie compile --all
      - name: UnitTest
        run: uv run pytest --disable-warnings -v tests/
      - name: Generate contract JSON
        run: uv run python tools/json_filter.py
      - uses: actions/upload-artifact@v7
        with:
          name: contract-json
          path: output
