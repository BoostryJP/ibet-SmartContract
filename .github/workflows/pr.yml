name: Pull Request Check
on: [pull_request]

jobs:
  lint-ruff:
    name: "Lint check (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --frozen --no-install-project
      - name: Ruff check
        run: uv run ruff check .
  lint-prettier:
    name: "Lint check (prettier)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - run: npm install
      - run: npx prettier --check --plugin=prettier-plugin-solidity contracts/**/*.sol interfaces/**/*.sol
  unit-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.9.2
        with:
          version: "1.5.1"  # stable
      - name: Install dependencies
        env:
          UV_MALWARE_CHECK: "1"
        run: uv sync --frozen --no-install-project
      - name: Install Solidity compiler
        run: |
          set -euo pipefail
          solcx_dir="$HOME/.solcx"
          temp_dir="$(mktemp -d)"
          compiler_path="$temp_dir/solc-static-linux"
          compiler_url="https://github.com/ethereum/solidity/releases/download/v0.8.34/solc-static-linux"
          compiler_sha256="d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39"
          mkdir -p "$solcx_dir"
          curl -fsSL "$compiler_url" -o "$compiler_path"
          echo "$compiler_sha256  $compiler_path" | sha256sum --check --status
          install -m 0755 "$compiler_path" "$solcx_dir/solc-v0.8.34"
      - name: Install Ape dependencies
        run: uv run ape pm install
      - name: Compile contracts
        run: uv run ape compile
      - name: UnitTest
        run: uv run ape test --network ethereum:local:foundry tests/
      - name: Generate contract JSON
        run: uv run python tools/json_filter.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: contract-json
          path: output
